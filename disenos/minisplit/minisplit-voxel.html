<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-Split — Voxel Massing</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #06080d; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    font: 12px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color: #cdd6df; background: rgba(6,8,13,.62); border: 1px solid #1c2530;
    border-radius: 8px; padding: 10px 12px; max-width: 340px; pointer-events: none;
  }
  #hud h1 { margin: 0 0 4px; font-size: 13px; color: #7fe9dc; letter-spacing: .3px; }
  #hud .sub { color: #8ea0ab; }
  #hud .pass { color: #ffcf6b; }
  #legend { position: fixed; top: 12px; right: 12px; z-index: 10;
    font: 11px/1.5 ui-monospace, monospace; color: #cdd6df;
    background: rgba(6,8,13,.62); border: 1px solid #1c2530; border-radius: 8px; padding: 8px 10px; }
  #legend .row { display: flex; align-items: center; gap: 6px; }
  #legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>MINI-SPLIT HVAC — voxel massing</h1>
  <div class="sub">indoor head unit + outdoor condenser</div>
  <div class="pass" id="passlabel">pass: blockout (voxel · 1 voxel = 0.05 m)</div>
  <div class="sub" id="dims">indoor 0.90×0.30×0.20 m · outdoor 0.84×0.55×0.30 m</div>
</div>
<div id="legend"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// SCALE: 1 voxel = 0.05 m ; 1 world unit = 1 m
const VS = 0.05;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080d);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(2.6, 2.2, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.autoRotate = false;
controls.target.set(0.2, 1.1, 0.15);

// --- light rig (generic defaults) ---
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(3.2, 5.0, 3.6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5; key.shadow.camera.far = 20;
key.shadow.camera.left = -5; key.shadow.camera.right = 5;
key.shadow.camera.top = 5; key.shadow.camera.bottom = -5;
scene.add(key);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.4).translateX(-4).translateY(3).translateZ(-2));
const rim = new THREE.DirectionalLight(0x00d4aa, 0.2); rim.position.set(-2, 2, -4); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xbcd0e0, 0x202830, 0.5));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// --- voxel builder: solid boxes rasterized to a voxel lattice, one InstancedMesh per color ---
const buckets = new Map(); // colorHex -> array of [ix,iy,iz]
function fillBox(color, x0, y0, z0, w, h, d) {
  // x0,y0,z0,w,h,d in METERS; rasterize to VS lattice
  const nx = Math.max(1, Math.round(w / VS));
  const ny = Math.max(1, Math.round(h / VS));
  const nz = Math.max(1, Math.round(d / VS));
  const bx = Math.round(x0 / VS), by = Math.round(y0 / VS), bz = Math.round(z0 / VS);
  let arr = buckets.get(color); if (!arr) { arr = []; buckets.set(color, arr); }
  for (let i = 0; i < nx; i++)
    for (let j = 0; j < ny; j++)
      for (let k = 0; k < nz; k++)
        arr.push([bx + i, by + j, bz + k]);
}
// shell-only fill (hollow) — keeps the blocky voxel read, fewer cubes
function fillShell(color, x0, y0, z0, w, h, d) {
  const nx = Math.max(1, Math.round(w / VS));
  const ny = Math.max(1, Math.round(h / VS));
  const nz = Math.max(1, Math.round(d / VS));
  const bx = Math.round(x0 / VS), by = Math.round(y0 / VS), bz = Math.round(z0 / VS);
  let arr = buckets.get(color); if (!arr) { arr = []; buckets.set(color, arr); }
  for (let i = 0; i < nx; i++)
    for (let j = 0; j < ny; j++)
      for (let k = 0; k < nz; k++) {
        const edge = i === 0 || i === nx - 1 || j === 0 || j === ny - 1 || k === 0 || k === nz - 1;
        if (edge) arr.push([bx + i, by + j, bz + k]);
      }
}

// Palette (flat voxel colors)
const C = {
  wall:    0x161c24,
  slab:    0x3c444c,
  bodyIn:  0xeef2f4,  // indoor white
  ventIn:  0xb7c0c6,  // louver grey
  disp:    0x2bd4c4,  // display teal
  bodyOut: 0xd6dce0,  // outdoor light grey
  grille:  0x39454e,  // fan grille dark
  blade:   0x8ea0ab,  // fan blades
  copper:  0xc98a5a,  // refrigerant pipe
  insul:   0xe6e8ea,  // pipe insulation
};

// ---- Diorama massing (meters) ----
// back wall
fillBox(C.wall, -1.5, 0.0, -0.20, 3.0, 2.5, 0.05);
// floor slab under outdoor unit
fillBox(C.slab, 0.85, 0.0, 0.10, 1.15, 0.10, 0.90);

// INDOOR head unit: 0.90 x 0.30 x 0.20, mounted high on the wall
const inX = -1.15, inY = 1.90, inZ = -0.15;
fillShell(C.bodyIn, inX, inY, inZ, 0.90, 0.30, 0.20);
// front louver band (bottom-front face)
fillBox(C.ventIn, inX + 0.05, inY + 0.02, inZ + 0.19, 0.80, 0.06, 0.02);
// display chip
fillBox(C.disp, inX + 0.62, inY + 0.19, inZ + 0.20, 0.14, 0.05, 0.02);

// OUTDOOR condenser: 0.84 x 0.55 x 0.30, on the slab
const outX = 1.00, outY = 0.10, outZ = 0.30;
fillShell(C.bodyOut, outX, outY, outZ, 0.84, 0.55, 0.30);
// fan grille (front circular-ish, rendered as a recessed dark panel + ring of blades)
const fcx = outX + 0.42, fcy = outY + 0.30, fcz = outZ + 0.30; // fan center, front face
// grille backing
fillBox(C.grille, outX + 0.10, outY + 0.06, outZ + 0.29, 0.64, 0.46, 0.02);
// blades: 4-arm voxel pinwheel
for (const [dx, dy] of [[0.16, 0], [-0.16, 0], [0, 0.16], [0, -0.16], [0.11, 0.11], [-0.11, -0.11]]) {
  fillBox(C.blade, fcx + dx - 0.03, fcy + dy - 0.03, fcz - 0.01, 0.06, 0.06, 0.03);
}
fillBox(C.blade, fcx - 0.04, fcy - 0.04, fcz - 0.01, 0.08, 0.08, 0.03); // hub

// LINE SET: insulated copper run from indoor unit down the wall and to the outdoor unit
// vertical drop behind indoor unit
fillBox(C.insul, inX + 0.02, outY + 0.20, inZ + 0.02, 0.06, 1.75, 0.06);
// horizontal run along the base toward outdoor unit
fillBox(C.insul, inX + 0.02, outY + 0.20, inZ + 0.02, 2.0, 0.06, 0.06);
// up into outdoor service valves
fillBox(C.copper, outX + 0.02, outY + 0.20, outZ + 0.02, 0.05, 0.22, 0.05);

// ---- Emit InstancedMesh per color ----
const geo = new THREE.BoxGeometry(VS, VS, VS);
const dummy = new THREE.Object3D();
const legendEl = document.getElementById('legend');
const legendNames = { wall: 'wall', slab: 'slab', bodyIn: 'indoor body', ventIn: 'louvers',
  disp: 'display', bodyOut: 'outdoor body', grille: 'fan grille', blade: 'fan', copper: 'copper', insul: 'lineset' };
const nameByColor = Object.fromEntries(Object.entries(C).map(([k, v]) => [v, legendNames[k]]));
const seenLegend = new Set();

for (const [color, cells] of buckets) {
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.0 });
  const im = new THREE.InstancedMesh(geo, mat, cells.length);
  im.castShadow = true; im.receiveShadow = true;
  for (let n = 0; n < cells.length; n++) {
    const [ix, iy, iz] = cells[n];
    dummy.position.set((ix + 0.5) * VS, (iy + 0.5) * VS, (iz + 0.5) * VS);
    dummy.updateMatrix();
    im.setMatrixAt(n, dummy.matrix);
  }
  im.instanceMatrix.needsUpdate = true;
  scene.add(im);
  const nm = nameByColor[color];
  if (nm && !seenLegend.has(nm)) {
    seenLegend.add(nm);
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<i style="background:#${color.toString(16).padStart(6, '0')}"></i>${nm}`;
    legendEl.appendChild(row);
  }
}

// ground plane (shadow catcher)
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x0b0f15, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

// --- deterministic capture hook (Hard Rule 9) ---
window.__cam = () => ({
  pos: camera.position.toArray(),
  target: controls.target.toArray(),
});
const camArg = new URLSearchParams(location.search).get('cam');
if (camArg) {
  const v = camArg.split(',').map(Number);
  if (v.length === 6) { camera.position.set(v[0], v[1], v[2]); controls.target.set(v[3], v[4], v[5]); }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

document.documentElement.setAttribute('data-app-ready', 'true');
</script>
</body>
</html>
